<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Košarka — Live TV panel</title>
<style>
  :root { color-scheme: dark; --home:#ff7a45; --away:#45a6ff; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px;
    background: linear-gradient(160deg,#0b1420,#05080e); color:#eaf1fa;
    font-family:"Segoe UI",system-ui,sans-serif;
  }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .wrap { width:960px; max-width:100%; display:flex; flex-direction:column; gap:14px; }

  /* header semafor */
  .top {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    background:linear-gradient(#101b29,#0a121c); border:1px solid #1e2c3e; border-radius:14px; padding:14px 24px;
  }
  .tm { display:flex; align-items:center; gap:12px; }
  .tm.r { justify-content:flex-end; }
  .logo { width:38px; height:38px; border-radius:10px; }
  .tm.h .logo { background:linear-gradient(135deg,#ff9a5a,var(--home)); }
  .tm.a .logo { background:linear-gradient(135deg,#6bb6ff,var(--away)); }
  .nm { font-weight:700; font-size:15px; } .rec { font-size:11px; color:#6f8098; }
  .big { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; }
  .mid { text-align:center; }
  .clk { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
  .qt { font-size:11px; letter-spacing:2px; color:#7385a0; }
  .live { display:inline-flex; align-items:center; gap:5px; font-size:10px; color:#ff5a5a; letter-spacing:2px; margin-top:4px;}
  .live .dot { width:7px; height:7px; border-radius:50%; background:#ff3a3a; animation:blink 1s infinite; }
  @keyframes blink { 50%{opacity:.25} }

  .grid { display:grid; grid-template-columns: 1fr 300px; gap:14px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .card { background:#0a121c; border:1px solid #1e2c3e; border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 12px; font-size:11px; letter-spacing:2px; color:#7385a0; }

  /* momentum */
  .mom-track { height:16px; border-radius:8px; overflow:hidden; display:flex; background:#16212f; }
  .mom-h { background:linear-gradient(90deg,#ff9a5a,var(--home)); transition:width .6s ease; }
  .mom-a { background:linear-gradient(90deg,var(--away),#6bb6ff); transition:width .6s ease; }
  .mom-lbl { display:flex; justify-content:space-between; font-size:11px; margin-top:6px; color:#8496af; }

  /* team compare bars */
  .row { display:grid; grid-template-columns:52px 1fr 40px; align-items:center; gap:8px; margin-bottom:9px; font-size:12px; font-variant-numeric:tabular-nums; }
  .row .name { color:#8496af; text-align:center; grid-column:1/4; margin-bottom:-4px; letter-spacing:1px; font-size:10px;}
  .bar { height:9px; border-radius:5px; background:#16212f; position:relative; overflow:hidden; }
  .bar > i { position:absolute; top:0; bottom:0; }
  .bar > i.h { left:50%; background:var(--home); transition:width .5s; }
  .bar > i.a { right:50%; background:var(--away); transition:width .5s; }
  .valh { text-align:left; color:#ffb08a; } .vala { text-align:right; color:#8ac6ff; }

  /* shot chart */
  .chart-wrap { position:relative; }
  #shots { width:100%; height:auto; border-radius:10px; display:block; }

  /* feed */
  .feed { max-height:520px; overflow-y:auto; }
  .ev { font-size:12.5px; padding:6px 0; border-bottom:1px solid #14202d; line-height:1.4; }
  .ev .tt { color:#5f7290; font-size:11px; }
  .ev.big-play { background:#14202d; margin:0 -8px; padding:6px 8px; border-radius:6px; border:none; }
  .ev .h { color:var(--home); font-weight:600; } .ev .a { color:var(--away); font-weight:600; }
  .ev .sc { color:#ffd24a; font-weight:700; }

  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  button { background:#1c2a3b; color:#eaf1fa; border:none; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; }
  button:hover { background:#26374d; }
  button.primary { background:#2f7d4f; } button.primary:hover{ background:#379059; }
  .spd button.active { background:#3a4d66; }
</style>
</head>
<body>
  <h1>📺 Live TV panel — simulacija utakmice</h1>
  <div class="wrap">

    <div class="top">
      <div class="tm h">
        <div class="logo"></div>
        <div><div class="nm">GROMOVI</div><div class="rec" id="rh">12-4</div></div>
        <div class="big" id="ph">0</div>
      </div>
      <div class="mid">
        <div class="clk" id="clk">12:00</div>
        <div class="qt" id="qt">ČETVRTINA 1</div>
        <div class="live"><span class="dot"></span>UŽIVO</div>
      </div>
      <div class="tm a r">
        <div class="big" id="pa">0</div>
        <div style="text-align:right"><div class="nm">OLUJE</div><div class="rec" id="ra">10-6</div></div>
        <div class="logo"></div>
      </div>
    </div>

    <div class="grid">
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <h3>MOMENTUM</h3>
          <div class="mom-track"><div class="mom-h" id="momH" style="width:50%"></div><div class="mom-a" id="momA" style="width:50%"></div></div>
          <div class="mom-lbl"><span id="momHt">GROMOVI</span><span id="momAt">OLUJE</span></div>
        </div>

        <div class="card">
          <h3>USPOREDBA EKIPA</h3>
          <div id="compare"></div>
        </div>

        <div class="card">
          <h3>MAPA ŠUTEVA</h3>
          <canvas id="shots" width="600" height="300"></canvas>
        </div>
      </div>

      <div class="card">
        <h3>KOMENTAR UŽIVO</h3>
        <div class="feed" id="feed"></div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="play">▶ Pokreni</button>
      <button id="pause">⏸ Pauza</button>
      <div class="spd" style="display:flex;gap:4px">
        <button data-s="1">1×</button><button data-s="3" class="active">3×</button>
        <button data-s="6">6×</button><button data-s="12">12×</button>
      </div>
      <button id="restart">↺ Nova</button>
    </div>
  </div>

<script>
const S = {
  home:{ key:'home', name:'GROMOVI', color:'#ff7a45', pts:0, fga:0, fgm:0, tpa:0, tpm:0, reb:0, ast:0, to:0, run:0 },
  away:{ key:'away', name:'OLUJE',  color:'#45a6ff', pts:0, fga:0, fgm:0, tpa:0, tpm:0, reb:0, ast:0, to:0, run:0 },
};
let quarter, clock, attacking, running=false, over=false, speed=3;
let momentum = 50; // 0..100, viši = domaći
const shots = []; // {x,y,made,side}

const shotCv = document.getElementById('shots'), sctx = shotCv.getContext('2d');
const CW = shotCv.width, CH = shotCv.height;

function drawShotChart(){
  // dva reketa: lijevo domaći napada desno, ali za jednostavnost crtamo pola-pola
  sctx.fillStyle='#0e1a27'; sctx.fillRect(0,0,CW,CH);
  sctx.strokeStyle='#24374d'; sctx.lineWidth=2;
  sctx.strokeRect(4,4,CW-8,CH-8);
  sctx.beginPath();sctx.moveTo(CW/2,4);sctx.lineTo(CW/2,CH-4);sctx.stroke();
  // koševi
  [[24,CH/2],[CW-24,CH/2]].forEach(h=>{sctx.strokeStyle='#d94a2a';sctx.beginPath();sctx.arc(h[0],h[1],6,0,7);sctx.stroke();});
  // linije za tricu
  sctx.strokeStyle='#24374d';
  sctx.beginPath();sctx.arc(24,CH/2,110,-Math.PI/2.6,Math.PI/2.6);sctx.stroke();
  sctx.beginPath();sctx.arc(CW-24,CH/2,110,Math.PI-Math.PI/2.6,Math.PI+Math.PI/2.6);sctx.stroke();
  shots.forEach(s=>{
    sctx.beginPath();
    if(s.made){ sctx.fillStyle=s.side==='home'?'#ff7a45':'#45a6ff'; sctx.arc(s.x,s.y,4,0,7); sctx.fill(); }
    else { sctx.strokeStyle=s.side==='home'?'#7a4530':'#305a7a'; sctx.lineWidth=1.5;
      sctx.moveTo(s.x-3,s.y-3);sctx.lineTo(s.x+3,s.y+3);sctx.moveTo(s.x+3,s.y-3);sctx.lineTo(s.x-3,s.y+3);sctx.stroke(); }
  });
}

function reset(){
  [S.home,S.away].forEach(t=>Object.assign(t,{pts:0,fga:0,fgm:0,tpa:0,tpm:0,reb:0,ast:0,to:0,run:0}));
  quarter=1; clock=720; attacking=Math.random()>.5?'home':'away'; over=false; momentum=50;
  shots.length=0;
  document.getElementById('feed').innerHTML='';
  render(); drawShotChart();
  addFeed('Skok za loptu — utakmica počinje! 🏀', '', true);
}

function possessionOutcome(){
  const off = S[attacking], defKey = attacking==='home'?'away':'home';
  // turnover?
  if(Math.random() < 0.11){
    off.to++;
    S[defKey].run += 1;
    off.run = 0;
    addFeed(`Izgubljena lopta — ${off.name} gubi posjed`, attacking);
    swing(defKey, 4);
    attacking = defKey; return;
  }
  const three = Math.random() > 0.63;
  off.fga++; if(three) off.tpa++;
  const p = three?0.36:0.51;
  const made = Math.random() < p;

  // shot loc na chartu (u napadačku polovicu)
  const hoopX = attacking==='home' ? CW-24 : 24;
  const dir = attacking==='home'? -1 : 1;
  const dist = three ? 90+Math.random()*40 : 20+Math.random()*70;
  const ang = (Math.random()-0.5)*1.6;
  const sx = hoopX + dir*Math.cos(ang)*dist;
  const sy = CH/2 + Math.sin(ang)*dist;
  shots.push({x:Math.max(8,Math.min(CW-8,sx)), y:Math.max(8,Math.min(CH-8,sy)), made, side:attacking});

  if(made){
    const pts = three?3:2;
    off.fgm++; if(three) off.tpm++; off.pts += pts;
    off.run += pts; S[defKey].run = 0;
    const assisted = Math.random()>0.4;
    if(assisted) off.ast++;
    const big = three || off.run>=6;
    addFeed(`${three?'TRICA! 💥':'Koš'} za ${off.name} (+${pts})${off.run>=6?` — serija ${off.run}:0!`:''}`,
            attacking, big, `${S.home.pts}-${S.away.pts}`);
    swing(attacking, three?9:6);
  } else {
    const rebTeam = Math.random()>0.7 ? attacking : defKey;
    S[rebTeam].reb++;
    addFeed(`${off.name} promašuje ${three?'tricu':'šut'} — skok ${S[rebTeam].name}`, rebTeam);
    swing(defKey, 3);
    off.run = 0;
  }
  attacking = defKey;
}

function swing(towardKey, amt){
  const target = towardKey==='home' ? amt : -amt;
  momentum = Math.max(6, Math.min(94, momentum + target));
}

function addFeed(text, side, big, score){
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'ev' + (big?' big-play':'');
  const m=Math.floor(clock/60), s=Math.floor(clock%60);
  const cls = side==='home'?'h':side==='away'?'a':'';
  div.innerHTML = `<span class="tt">Q${quarter} ${m}:${String(s).padStart(2,'0')}</span> `+
    `<span class="${cls}">${text}</span>${score?` <span class="sc">${score}</span>`:''}`;
  feed.insertBefore(div, feed.firstChild);
}

const COMPARE = [
  {k:'pts', label:'POENI'},
  {k:'fgm', label:'KOŠEVI'},
  {k:'tpm', label:'TRICE'},
  {k:'reb', label:'SKOKOVI'},
  {k:'ast', label:'ASISTENCIJE'},
  {k:'to',  label:'IZG. LOPTE'},
];
function render(){
  document.getElementById('ph').textContent=S.home.pts;
  document.getElementById('pa').textContent=S.away.pts;
  const m=Math.floor(clock/60),s=Math.floor(clock%60);
  document.getElementById('clk').textContent=`${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('qt').textContent=over?'ZAVRŠENO':`ČETVRTINA ${quarter}`;
  // momentum
  document.getElementById('momH').style.width=momentum+'%';
  document.getElementById('momA').style.width=(100-momentum)+'%';
  // compare
  const cmp = document.getElementById('compare');
  cmp.innerHTML = COMPARE.map(c=>{
    const h=S.home[c.k], a=S.away[c.k], max=Math.max(h,a,1);
    return `<div class="row"><span class="name">${c.label}</span></div>`+
      `<div class="row"><span class="valh">${h}</span>`+
      `<div class="bar"><i class="h" style="width:${h/max*48}%"></i><i class="a" style="width:${a/max*48}%"></i></div>`+
      `<span class="vala">${a}</span></div>`;
  }).join('');
}

// clock loop
let last=performance.now(), acc=0;
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(running && !over){
    clock -= dt * speed * 2.5;
    acc += dt * speed;
    // svaka ~0.5s realnog vremena * speed jedna akcija
    if(acc > 0.6){ acc=0; if(!over) possessionOutcome(); render(); drawShotChart(); }
    if(clock<=0){
      clock=720;
      if(quarter>=4){
        over=true; running=false;
        const w=S.home.pts>S.away.pts?'GROMOVI':S.away.pts>S.home.pts?'OLUJE':'NERIJEŠENO';
        addFeed(`KRAJ! Pobjeda: ${w} (${S.home.pts}-${S.away.pts}) 🏆`,'',true,`${S.home.pts}-${S.away.pts}`);
      } else { quarter++; addFeed(`Kraj ${quarter-1}. četvrtine`,''); }
      render();
    } else {
      const m=Math.floor(clock/60),s=Math.floor(clock%60);
      document.getElementById('clk').textContent=`${m}:${String(s).padStart(2,'0')}`;
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('play').onclick=()=>{ if(over) reset(); running=true; };
document.getElementById('pause').onclick=()=>running=false;
document.getElementById('restart').onclick=()=>{ reset(); running=true; };
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
  speed=+b.dataset.s;
  document.querySelectorAll('.spd button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
});

document.getElementById('momHt').textContent=S.home.name;
document.getElementById('momAt').textContent=S.away.name;
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
