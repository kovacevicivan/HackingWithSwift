<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Košarka 2D — CSS akcija dodavanja</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 30%, #16324f, #06101c);
    font-family: "Segoe UI", system-ui, sans-serif; color: #eaf2fb; padding: 20px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .board {
    display: flex; align-items: center; gap: 18px; background: #0d1725;
    border: 1px solid #22354d; border-radius: 12px; padding: 8px 20px;
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px;
  }
  .board .lbl { font-size: 13px; letter-spacing: 2px; color: #7f93ad; font-weight: 600; }

  /* --- Teren (SVG-slično, čisti CSS) --- */
  .court {
    position: relative; width: 760px; max-width: 100%; aspect-ratio: 760 / 440;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 34px, transparent 34px 68px),
      linear-gradient(#c9853f, #b26e2c);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 0 0 4px #f4f1e8;
  }
  .line { position: absolute; background: #f4f1e8; }
  .center-line { left: 50%; top: 2%; width: 3px; height: 96%; transform: translateX(-50%); }
  .center-circle {
    left: 50%; top: 50%; width: 130px; height: 130px; transform: translate(-50%,-50%);
    border: 3px solid #f4f1e8; border-radius: 50%; background: transparent; position: absolute;
  }
  .paint { position: absolute; top: 50%; width: 120px; height: 150px; transform: translateY(-50%);
    border: 3px solid #f4f1e8; }
  .paint.left { left: 2%; } .paint.right { right: 2%; }
  .hoop { position: absolute; top: 50%; width: 20px; height: 20px; transform: translateY(-50%);
    background: #d94a2a; border: 2px solid #fff; border-radius: 50%; }
  .hoop.left { left: 3%; } .hoop.right { right: 3%; }

  /* --- Igrači --- */
  .player {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    transform: translate(-50%,-50%); border: 2px solid rgba(255,255,255,.75);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; transition: box-shadow .25s;
  }
  .player.home { background: #ff6b4a; }
  .player.away { background: #4aa8ff; }
  .player.active { box-shadow: 0 0 0 4px #ffe14a; }
  .player::after {
    content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    width:22px; height:7px; background:rgba(0,0,0,.25); border-radius:50%;
  }

  /* --- Lopta --- */
  .ball {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 6px 6px, #ffb066, #d9691f);
    border: 1.5px solid #5a2c0c; transform: translate(-50%,-50%);
    transition: left .5s cubic-bezier(.4,-0.3,.5,1.3), top .5s cubic-bezier(.4,-0.3,.5,1.3);
    z-index: 5; box-shadow: 0 4px 8px rgba(0,0,0,.35);
  }
  .ball::before, .ball::after {
    content:''; position:absolute; inset:0; border-radius:50%;
    border: 1px solid #5a2c0c;
  }
  .ball::before { border-left:0; border-right:0; }
  .ball::after { border-top:0; border-bottom:0; }

  .flash {
    position:absolute; inset:0; background: radial-gradient(circle, rgba(255,225,74,.6), transparent 60%);
    opacity:0; pointer-events:none; z-index: 9;
  }
  .flash.on { animation: pop .6s ease-out; }
  @keyframes pop { 0%{opacity:1; transform:scale(.6)} 100%{opacity:0; transform:scale(1.4)} }

  .status { font-size: 14px; color: #9fb2c9; min-height: 20px; }
</style>
</head>
<body>
  <h1>🏀 Akcija dodavanja — čisti CSS/HTML</h1>
  <div class="board">
    <span class="lbl">DOM</span><span id="sh">0</span>
    <span class="lbl" style="color:#4a5c72">:</span>
    <span id="sa">0</span><span class="lbl">GOST</span>
  </div>

  <div class="court" id="court">
    <div class="center-line line"></div>
    <div class="center-circle"></div>
    <div class="paint left"></div>
    <div class="paint right"></div>
    <div class="hoop left"></div>
    <div class="hoop right"></div>
    <div class="ball" id="ball"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="status" id="status">Uvod u utakmicu…</div>

<script>
const court = document.getElementById('court');
const ball = document.getElementById('ball');
const flash = document.getElementById('flash');
const statusEl = document.getElementById('status');

// pozicije u postotcima terena
const homeSpots = [ [25,20],[18,50],[25,80],[40,35],[40,65] ];
const awaySpots = [ [75,20],[82,50],[75,80],[60,35],[60,65] ];

const players = [];
function place(team, spots) {
  spots.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = `player ${team}`;
    el.textContent = i+1;
    el.style.left = s[0] + '%';
    el.style.top = s[1] + '%';
    court.appendChild(el);
    players.push({ el, team, x: s[0], y: s[1] });
  });
}
place('home', homeSpots);
place('away', awaySpots);

let score = { home: 0, away: 0 };
let attacking = 'home';
let holder = null;

function moveBallTo(x, y) { ball.style.left = x + '%'; ball.style.top = y + '%'; }
function setActive(p) {
  players.forEach(pl => pl.el.classList.toggle('active', pl === p));
  holder = p;
}

const names = ['Perić','Marić','Jurić','Novak','Kovač','Babić','Horvat'];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

async function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function possession() {
  const team = players.filter(p => p.team === attacking);
  let p = rnd(team);
  setActive(p);
  moveBallTo(p.x, p.y);
  statusEl.textContent = `${attacking==='home'?'DOM':'GOST'} u napadu — ${rnd(names)} vodi loptu`;
  await wait(700);

  const passes = 2 + Math.floor(Math.random()*3);
  for (let i = 0; i < passes; i++) {
    let next = rnd(team);
    while (next === p) next = rnd(team);
    statusEl.textContent = `Dodavanje: ${rnd(names)} → ${rnd(names)}`;
    setActive(next); moveBallTo(next.x, next.y);
    p = next;
    await wait(650);
  }

  // šut
  const shooter = rnd(names);
  statusEl.textContent = `${shooter} se diže na šut…`;
  const hoop = attacking === 'home' ? [95, 50] : [5, 50];
  moveBallTo(hoop[0], hoop[1]);
  await wait(550);

  const made = Math.random() > 0.42;
  if (made) {
    const pts = Math.random() > 0.7 ? 3 : 2;
    score[attacking] += pts;
    document.getElementById('sh').textContent = score.home;
    document.getElementById('sa').textContent = score.away;
    statusEl.textContent = `KOŠ! ${shooter} pogađa za ${pts} 🏀`;
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  } else {
    statusEl.textContent = `${shooter} promašuje — skok pod košem`;
  }
  await wait(1100);

  attacking = attacking === 'home' ? 'away' : 'home';
  possession();
}

possession();
</script>
</body>
</html>
